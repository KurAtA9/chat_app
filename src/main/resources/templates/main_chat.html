<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<div th:fragment="main_chat">
  <div class="main-header">
    <div class="left-header">aaaaa</div>
    <div class="right-header">
      <a class="quitChat" href="#">チャット終了</a>
    </div>
  </div>
  <div class="chatroom">
    <div class="upper-chat">
      <div class="chat-user">Tom</div>
      <div class="chat-date">2020/2/21(null) 12:21:12</div>
    </div>
    <div class="lower-message">
      <div class="chat-content">やっほー</div>
    </div> 
  </div>
  <div class="form">
    <div class="chat-input">
      <input type="text" class="chat-message" placeholder="type a message">
      <span class="image-file">画像</span>
      <input type="file" class="hidden">
    </div>
    <input type="submit" class="chat-submit" value="送信">
  </div>
</div>
</html>
